<article
  class="group has-[a:focus-visible]:outline has-[a:focus-visible]:outline-2 has-[a:focus-visible]:outline-offset-4 has-[a:focus-visible]:outline-accent"
  [class.card--action-visible]="alwaysShowAction()"
>
  <div class="relative aspect-[2/3] overflow-hidden rounded-md bg-surface-2">
    <a
      class="block h-full text-inherit no-underline focus-visible:outline-none"
      [routerLink]="['/movies', movie().id]"
      (pointerdown)="armPoster($event)"
      (keydown)="armPoster($event)"
    >
      @if (posterUrl(); as src) {
        <img
          class="size-full object-cover transition-transform duration-enter ease-frame group-hover:scale-[1.03] group-focus-within:scale-[1.03]"
          [src]="src"
          [alt]="movie().title + ' poster'"
          width="342"
          height="513"
          loading="lazy"
          decoding="async"
          (error)="markImageFailed()"
        />
      } @else {
        <span class="card__fallback">{{ movie().title }}</span>
      }
    </a>
    <span
      class="pointer-events-none absolute inset-0 bg-[linear-gradient(180deg,transparent_62%,rgb(11_11_15/0.42))]"
      aria-hidden="true"
    ></span>
    <button
      type="button"
      class="absolute top-[0.45rem] right-[0.45rem] z-[1] grid size-9 cursor-pointer place-items-center rounded-full border-0 bg-canvas/62 text-ink opacity-0 transition-opacity duration-frame ease-frame group-hover:opacity-100 group-focus-within:opacity-100 group-[.card--action-visible]:opacity-100 max-md:opacity-100 [&.is-saved]:text-accent [&.is-saved]:opacity-100"
      [class.is-saved]="saved()"
      [attr.aria-pressed]="saved()"
      [attr.aria-label]="
        (saved() ? 'Remove ' : 'Add ') +
        movie().title +
        (saved() ? ' from wishlist' : ' to wishlist')
      "
      (click)="toggle($event)"
    >
      <app-icon [name]="saved() ? 'heart-filled' : 'heart'" />
    </button>
  </div>
  <p class="mt-[0.55rem] text-[0.92rem] leading-[1.3] font-semibold tracking-[-0.02em]">
    <a
      class="text-inherit no-underline transition-colors duration-frame ease-frame hover:text-accent"
      [routerLink]="['/movies', movie().id]"
      (pointerdown)="armPoster($event)"
      (keydown)="armPoster($event)"
      >{{ movie().title }}</a
    >
  </p>
  @if (movie().releaseYear) {
    <p class="mt-[0.15rem] text-[0.8rem] text-muted">{{ movie().releaseYear }}</p>
  }
</article>
