<a
  class="group relative block aspect-[2/3] overflow-hidden rounded-md bg-surface-2 text-inherit no-underline"
  [routerLink]="['/genres', genreId()]"
>
  @if (imageUrl(); as src) {
    <img
      class="size-full object-cover transition-transform duration-enter ease-frame group-hover:scale-[1.03] group-focus-visible:scale-[1.03]"
      [src]="src"
      alt=""
      width="780"
      height="1170"
      loading="lazy"
      decoding="async"
    />
  } @else {
    <span class="card__fallback" aria-hidden="true"></span>
  }
  <span
    class="absolute inset-0 bg-[linear-gradient(180deg,transparent_42%,rgb(11_11_15/0.92))]"
  ></span>
  <span
    class="genre-card__copy absolute right-[0.7rem] bottom-[0.7rem] left-[0.7rem] flex flex-wrap items-baseline gap-x-[0.35rem] gap-y-[0.05rem]"
  >
    <span
      class="genre-card__name font-semibold [text-shadow:0_1px_8px_rgb(11_11_15/0.65)]"
      >{{ name() }}</span
    >
    @let total = count();
    @if (total !== null) {
      <span
        class="text-[0.75rem] font-medium whitespace-nowrap text-muted [text-shadow:0_1px_8px_rgb(11_11_15/0.65)]"
      >
        @if (countKind() === 'preview') {
          {{ formatCount(total) }} in preview
        } @else {
          · {{ formatCount(total) }} {{ total === 1 ? 'movie' : 'movies' }}
        }
      </span>
    }
  </span>
</a>
